name: robo-queda-papel-v48
on:
  schedule:
    - cron: '*/30 * * * *'   # reserva: o agendamento do GitHub atrasa/pula, por isso cada rodada já encomenda a próxima
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Encomenda a próxima rodada (fica na fila e começa assim que esta terminar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run robo_v48.yml --ref main --repo ${{ github.repository }} || echo "não deu para encomendar; o agendamento de reserva continua"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Robô
        env:
          TZ: America/Sao_Paulo
        run: |
          git config user.name "robo-queda"
          git config user.email "robo-queda@users.noreply.github.com"
          node robo_v48.mjs
